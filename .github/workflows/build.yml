name: Build Python to EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - 名称: 检出代码库
        使用: actions/checkout@v4

      - 名称: 设置 Python 环境
        使用: actions/setup-python@v4
        with:
          python版本: '3.10'

      - 名称: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - 名称: 构建EXE
        run: |
          pyinstaller --onefile project/anzhuo/main.py --name BirthdayApp

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          名称: BirthdayApp
          路径: dist/BirthdayApp.exe
